name = "vhs-city-status"
main = "worker/index.js"
compatibility_date = "2026-08-01"
workers_dev = true

# 無料枠: Cron CPU 10ms。discover=新規発見、watch=既知IDの再確認（ずらして二重書き込みを避ける）
# KV: discover 約288×2（心跳+成功）+ watch 約288 ≒ 860回/日 < 1000
[triggers]
crons = ["*/5 * * * *", "2-59/5 * * * *"]

[[kv_namespaces]]
binding = "STATUS_KV"
# 初回: npx wrangler kv namespace create STATUS_KV
# 出力された id を下行に設定
id = "226a65529d7c4869b8fa8e43e528999b"
preview_id = "226a65529d7c4869b8fa8e43e528999b"

# secrets:
#   npx wrangler secret put YOUTUBE_API_KEY
#   npx wrangler secret put REFRESH_SECRET
